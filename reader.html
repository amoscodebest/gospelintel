            --skeleton-bg: #27272a;

            margin: 0;

        a {

            top: 0;

            backdrop-filter: blur(12px);

    <!-- Basic UI Scripts -->
    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const currentTheme = localStorage.getItem('gospel_theme') || 'light';

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        themeToggle.addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('gospel_theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('gospel_theme', 'dark');
            }
        });

        // Reading Scroll Progress Indicator
        window.onscroll = function() {
            let winScroll = document.body.scrollTop || document.documentElement.scrollTop;
            let height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
            let scrolled = (winScroll / height) * 100;
            document.getElementById("progressBar").style.width = scrolled + "%";
        };

        // Scroll to Comments
        function scrollToComments() {
            document.getElementById('commentsArea').scrollIntoView({ behavior: 'smooth' });
        }

        // Base domain & URL parameter helpers
        const BASE_DOMAIN = "https://gospelintel.vercel.app";
        const urlParams = new URLSearchParams(window.location.search);
        const articleId = urlParams.get('id');

        // Helper: Generates Vercel Edge Function share URL
        function getShareableUrl() {
            return articleId ? `${BASE_DOMAIN}/share/${articleId}` : `${BASE_DOMAIN}/reader.html`;
        }

        // Social Sharing Handlers (Constructs Edge Function links for WhatsApp/Facebook/X)
        function copyArticleLink() {
            navigator.clipboard.writeText(getShareableUrl());
            alert("Article link copied for social sharing!");
        }

        function shareToTwitter() {
            const title = encodeURIComponent(document.title);
            const url = encodeURIComponent(getShareableUrl());
            window.open(`https://twitter.com/intent/tweet?text=${title}&url=${url}`, '_blank');
        }

        function shareToWhatsApp() {
            const title = encodeURIComponent(document.title);
            const url = encodeURIComponent(getShareableUrl());
            window.open(`https://api.whatsapp.com/send?text=${title}%20${url}`, '_blank');
        }

        function shareArticle() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: getShareableUrl()
                });
            } else {
                copyArticleLink();
            }
        }
    </script>

        function formatDropboxUrl(url) {
            if (!url) return 'https://images.unsplash.com/photo-1438232992991-995b7058bbb3?auto=format&fit=crop&w=1200&q=80';
            let cleanUrl = url.trim();
            if (cleanUrl.includes('dropbox.com')) {
                cleanUrl = cleanUrl.replace('dl=0', 'raw=1').replace('dl=1', 'raw=1');
                if (!cleanUrl.includes('raw=1')) {
                    cleanUrl += cleanUrl.includes('?') ? '&raw=1' : '?raw=1';
                }
            }
            return cleanUrl;
        }

        // Dynamic Meta, Open Graph, Twitter & Canonical Injector Function
        function updateArticleSEO(data, id) {
            const currentFullUrl = `${BASE_DOMAIN}/reader.html?id=${id}`;
            const shareUrl = `${BASE_DOMAIN}/share/${id}`;
            const cleanTitle = `${data.title} | Gospel Intel`;
            const cleanDesc = data.excerpt || "Read full story on Gospel Intel - Global Church News & Actionable Faith Insights.";
            const imageUrl = formatDropboxUrl(data.imageUrl);

            // Update Page Title, Meta Title, Description & Canonical URL
            document.title = cleanTitle;
            document.getElementById('metaTitleTag').setAttribute('content', cleanTitle);
            document.getElementById('metaDescription').setAttribute('content', cleanDesc);
            document.getElementById('metaCanonical').setAttribute('href', currentFullUrl);

            // Update Open Graph (WhatsApp / Facebook / LinkedIn)
            document.getElementById('ogUrl').setAttribute('content', shareUrl);
            document.getElementById('ogTitle').setAttribute('content', cleanTitle);
            document.getElementById('ogDescription').setAttribute('content', cleanDesc);
            document.getElementById('ogImage').setAttribute('content', imageUrl);
            document.getElementById('ogImageAlt').setAttribute('content', data.title);

            // Update Twitter / X
            document.getElementById('twitterUrl').setAttribute('content', shareUrl);
            document.getElementById('twitterTitle').setAttribute('content', cleanTitle);
            document.getElementById('twitterDescription').setAttribute('content', cleanDesc);
            document.getElementById('twitterImage').setAttribute('content', imageUrl);

            // Update JSON-LD Schema.org Data
            const pubDate = data.createdAt?.toDate ? data.createdAt.toDate().toISOString() : new Date().toISOString();
            const modDate = data.updatedAt?.toDate ? data.updatedAt.toDate().toISOString() : pubDate;

            const schemaData = {
                "@context": "https://schema.org",
                "@type": "NewsArticle",
                "mainEntityOfPage": {
                    "@type": "WebPage",
                    "@id": currentFullUrl
                },
                "headline": data.title,
                "image": [imageUrl],
                "datePublished": pubDate,
                "dateModified": modDate,
                "author": {
                    "@type": "Person",
                    "name": data.author?.name || "Gospel Intel Desk"
                },
                "publisher": {
                    "@type": "Organization",
                    "name": "Gospel Intel",
                    "logo": {
                        "@type": "ImageObject",
                        "url": `${BASE_DOMAIN}/assets/logo.png`
                    }
                },
                "description": cleanDesc
            };

            document.getElementById('schemaStructuredData').textContent = JSON.stringify(schemaData);
        }

        document.addEventListener("DOMContentLoaded", () => {
            if (!articleId) {
                document.getElementById('loadingState').innerHTML = `<p style="color: var(--accent-color);">Invalid article URL. Please return to <a href="index.html" style="text-decoration: underline;">Home Page</a>.</p>`;
                return;
            }
            loadArticleData();
            loadComments();
        });

        // 1. Fetch Article from Firestore
        async function loadArticleData() {
            try {
                const docRef = doc(db, "articles", articleId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();

                    // Inject Dynamic SEO, Open Graph & Canonical Tag
                    updateArticleSEO(data, articleId);

                    document.getElementById('artCategory').textContent = data.category || 'Kingdom News';
                    document.getElementById('artTitle').textContent = data.title;
                    document.getElementById('artAuthorName').textContent = data.author?.name || 'Gospel Intel Staff';
                    if (data.author?.avatar) {
                        document.getElementById('artAuthorAvatar').src = data.author.avatar;
                    }
                    document.getElementById('artReadTime').textContent = data.readTime || '5 mins read';
                    
                    if (data.createdAt) {
                        const dateObj = data.createdAt.toDate ? data.createdAt.toDate() : new Date(data.createdAt);
                        document.getElementById('artDate').textContent = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                    }

                    // Cover Image Rendering
                    if (data.imageUrl) {
                        document.getElementById('artCoverImg').src = formatDropboxUrl(data.imageUrl);
                    } else {
                        document.getElementById('artCoverBox').style.display = 'none';
                    }

                    // Content Body Rendering
                    document.getElementById('artBody').innerHTML = data.content;

                    // Likes Handling
                    currentLikes = data.stats?.likes || 0;
                    document.getElementById('likeCount').textContent = currentLikes;

                    // Reveal Content Body
                    document.getElementById('loadingState').style.display = 'none';
                    document.getElementById('articleMain').style.display = 'block';

                    // Increment Page Views Count
                    updateDoc(docRef, { "stats.views": increment(1) }).catch(() => {});

                } else {
                    document.getElementById('loadingState').innerHTML = `<p>Story not found in database. It may have been unassigned or deleted.</p>`;
                }
            } catch (err) {
                console.error("Error fetching story:", err);
                document.getElementById('loadingState').innerHTML = `<p>Error loading article. Please check your internet connection.</p>`;
            }
        }

        // 2. Handle Article Like Toggle
        window.toggleLike = async function() {
            const likeIcon = document.getElementById('likeIcon');
            const likeBtn = document.getElementById('likeBtn');
            const likeCountEl = document.getElementById('likeCount');

            const docRef = doc(db, "articles", articleId);

            if (!isLiked) {
                isLiked = true;
                currentLikes++;
                likeIcon.classList.replace('fa-regular', 'fa-solid');
                likeBtn.classList.add('active');
                likeCountEl.textContent = currentLikes;
                await updateDoc(docRef, { "stats.likes": increment(1) });
            } else {
                isLiked = false;
                currentLikes--;
                likeIcon.classList.replace('fa-solid', 'fa-regular');
                likeBtn.classList.remove('active');
                likeCountEl.textContent = currentLikes;
                await updateDoc(docRef, { "stats.likes": increment(-1) });
            }
        };

        // 3. Load Article Comments
        async function loadComments() {
            try {
                const q = query(
                    collection(db, "articles", articleId, "comments"),
                    orderBy("createdAt", "desc")
                );
                const snapshot = await getDocs(q);
                const commentList = document.getElementById('commentList');

                if (!snapshot.empty) {
                    commentList.innerHTML = "";
                    document.getElementById('commentCount').textContent = snapshot.size;
                    document.getElementById('commentsHeaderCount').textContent = `${snapshot.size} Reflections`;

                    snapshot.forEach((docSnap) => {
                        const item = docSnap.data();
                        const dateStr = item.createdAt ? new Date(item.createdAt.toDate()).toLocaleDateString() : 'Just now';

                        commentList.innerHTML += `
                            <div class="comment-item">
                                <div class="comment-header">
                                    <span class="comment-author">${item.name}</span>
                                    <span class="comment-date">${dateStr}</span>
                                </div>
                                <div class="comment-body">${item.text}</div>
                            </div>
                        `;
                    });
                } else {
                    document.getElementById('commentCount').textContent = "0";
                    document.getElementById('commentsHeaderCount').textContent = "0 Comments";
                }
            } catch (err) {
                console.warn("Comments loader:", err);
            }
        }

        // 4. Submit New Reflection/Comment
        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('postCommentBtn');
            const name = document.getElementById('commenterName').value.trim();
            const text = document.getElementById('commentText').value.trim();

            if (name && text) {
                submitBtn.disabled = true;
                submitBtn.textContent = "Posting...";

                try {
                    await addDoc(collection(db, "articles", articleId, "comments"), {
                        name: name,
                        text: text,
                        createdAt: serverTimestamp()
                    });

                    await updateDoc(doc(db, "articles", articleId), {
                        "stats.comments": increment(1)
                    });

                    document.getElementById('commentText').value = "";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Post Comment";
                    loadComments();
                } catch (err) {
                    alert("Unable to post comment. Please try again.");
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Post Comment";
                }
            }
        });
    </script>
</body>
